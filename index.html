<!doctype html>
<html lang="en">
  <head>
    <!-- build: ruoff-embed-v1 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask Ruoff</title>
    <meta
      name="description"
      content="Ask Ruoff — instant, grounded answers on mortgage guidelines, overlays, and policy."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ask Ruoff" />
    <meta
      property="og:description"
      content="Ask Ruoff — instant, grounded answers on mortgage guidelines, overlays, and policy."
    />

    <link rel="icon" href="https://www.ruoff.com/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme tokens + loader -->
    <style id="theme-init">
      :root {
        /* Ruoff brand */
        --ruoff-navy: #132e42;
        --ruoff-navy-80: #1c4057;
        --ruoff-teal: #1f8a9d;

        /* Dark page theme (Ruoff-flavored askbob) */
        --bg-color: #091c2d;
        --text-color: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.8);
        --primary-color: var(--ruoff-navy);
        --submit-btn-color: var(--ruoff-teal);
        --scheme: dark;

        --input-bg: rgba(255, 255, 255, 0.18);
        --input-border: rgba(255, 255, 255, 0.25);
        --muted-color: rgba(255, 255, 255, 0.5);
        --muted-hover: #ffffff;
        --skeleton-bg: rgba(255, 255, 255, 0.08);
        --assistant-bg: transparent;
        --assistant-color: #ffffff;

        --modal-bg: #091c2d;
        --modal-input-bg: rgba(255, 255, 255, 0.15);
        --modal-input-border: rgba(255, 255, 255, 0.2);
        --modal-text: #ffffff;
        --modal-text-secondary: rgba(255, 255, 255, 0.65);
        --modal-surface: rgba(255, 255, 255, 0.08);
        --modal-divider-text: rgba(255, 255, 255, 0.35);
        --modal-disabled-bg: rgba(255, 255, 255, 0.1);
        --thinking-color: rgba(255, 255, 255, 0.7);
        --theme-prose-bold: #ffffff;
        --theme-prose-links: var(--ruoff-teal);
        --user-bubble-bg: var(--ruoff-navy-80);
        --user-bubble-color: #ffffff;
        --trending-icon-color: var(--ruoff-teal);
        --scroll-btn-bg: var(--ruoff-navy-80);

        --header-height: 80px;
      }

      html,
      body {
        background: var(--bg-color) !important;
        background-attachment: fixed !important;
        color: var(--text-color) !important;
        color-scheme: var(--scheme);
        height: 100dvh;
      }

      #chatbot-container {
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      #chatbot-container.ready {
        opacity: 1;
      }

      /* Loading skeleton */
      #chatbot-loader {
        position: fixed;
        inset: var(--header-height) 0 0 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 15vh;
        gap: 16px;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.4s ease;
      }

      #chatbot-loader.hidden {
        opacity: 0;
      }

      .skeleton-line {
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          var(--input-bg, #e8e8e8) 25%,
          var(--input-border, #d0d0d0) 50%,
          var(--input-bg, #e8e8e8) 75%
        );
        background-size: 200% 100%;
        animation: skeleton-shimmer 1.4s infinite;
      }

      .skeleton-title {
        width: min(420px, 70vw);
        height: 28px;
      }

      .skeleton-subtitle {
        width: min(300px, 50vw);
        height: 16px;
        opacity: 0.7;
      }

      .skeleton-input {
        width: min(600px, calc(100vw - 48px));
        height: 56px;
        border-radius: 28px;
        margin-top: 8px;
      }

      .skeleton-chips {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(600px, calc(100vw - 48px));
      }

      .skeleton-chip {
        height: 34px;
        border-radius: 17px;
        flex: 0 0 auto;
      }

      @keyframes skeleton-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--bg-color);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
      }

      /* Brand wash — soft teal glow top, warm navy lift bottom-right */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
            ellipse 90% 55% at 50% -15%,
            rgba(31, 138, 157, 0.18) 0%,
            rgba(31, 138, 157, 0.06) 45%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 60% 40% at 85% 115%,
            rgba(28, 64, 87, 0.35) 0%,
            transparent 65%
          );
        pointer-events: none;
        z-index: 0;
      }

      /* ── Site header (Ruoff) ── */
      .site-header {
        align-self: stretch;
        position: sticky;
        top: 0;
        z-index: 2147483647;
        height: var(--header-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: transparent;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: #ffffff;
      }

      .brand-logo {
        height: 56px;
        width: auto;
        display: block;
      }

      .header-actions {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .askbob-link {
        display: inline-flex;
        align-items: center;
        border-radius: 8px;
        text-decoration: none;
      }

      .askbob-link:focus-visible {
        outline: 2px solid var(--ruoff-teal);
        outline-offset: 2px;
      }

      .askbob-logo {
        height: 22px;
        width: auto;
        display: block;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: inherit;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        transition: background 120ms ease, border-color 120ms ease,
          color 120ms ease;
      }

      .btn-primary {
        color: #fff;
        background: var(--ruoff-navy);
        border-color: var(--ruoff-navy);
      }

      .btn-primary:hover {
        background: var(--ruoff-navy-80);
        border-color: var(--ruoff-navy-80);
      }

      /* ── Chatbot container — ported from reference, Ruoff-tokened ── */
      #chatbot-container {
        position: relative;
        z-index: 1000;
        max-width: 852px;
        width: calc(100% - 32px);
        margin: auto;
        height: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;

        /* SDK tokens */
        --askbob-color-primary: var(--primary-color);
        --askbob-font-family: "Inter", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        /* Input */
        --askbob-color-input-text: var(--text-color);
        --askbob-input-bg: var(--input-bg);
        --askbob-radius-input: 100px;
        --askbob-padding-input: 14px 24px;
        --askbob-input-focus-shadow: 0 0 0 2px var(--primary-color),
          0 4px 20px rgba(0, 0, 0, 0.08);

        /* Icons */
        --askbob-color-muted: var(--muted-color);
        --askbob-color-muted-hover: var(--muted-hover);
        --askbob-trending-icon-color: var(--trending-icon-color);
        --askbob-color-prompts-hover-bg: rgba(255, 255, 255, 0.08);
        --askbob-color-input-placeholder: rgba(255, 255, 255, 0.55);
        --askbob-radius-prompts-item: 100px;

        /* Wrapper — auto height so empty slots don't take space */
        --askbob-wrapper-shadow: none;
        --askbob-wrapper-height: auto;
        --askbob-wrapper-overflow: visible;
        --askbob-followup-shadow: 0 -1px 0 0 var(--input-border);
        --askbob-skeleton-bg: var(--skeleton-bg);

        /* Bubbles */
        --askbob-bubble-user-bg: var(--user-bubble-bg);
        --askbob-bubble-user-color: var(--user-bubble-color);
        --askbob-bubble-user-min-width: 150px;
        --askbob-bubble-user-max-width: 75%;
        --askbob-bubble-user-radius: 20px;
        --askbob-bubble-assistant-bg: var(--assistant-bg);
        --askbob-bubble-assistant-color: var(--assistant-color);
        --askbob-bubble-assistant-min-width: 0;
        --askbob-bubble-assistant-max-width: 100%;

        --askbob-submit-btn-bg: var(--submit-btn-color);
        --askbob-thinking-text-color: var(--thinking-color);
        --askbob-thinking-dot-color: var(--thinking-color);

        /* Modal */
        --askbob-modal-bg: var(--modal-bg);
        --askbob-modal-input-bg: var(--modal-input-bg);
        --askbob-modal-input-border: var(--modal-input-border);
        --askbob-modal-btn-bg: var(--askbob-bubble-user-bg);
        --askbob-modal-btn-color: var(--askbob-bubble-user-color);
        --askbob-modal-divider-text-color: var(--modal-divider-text);
        --askbob-markdown-strong-color: var(--theme-prose-bold);
        --askbob-markdown-link-color: var(--theme-prose-links);
        --askbob-markdown-link-color-hover: var(--theme-prose-links);
        --askbob-color-disabled-bg: var(--modal-disabled-bg);
        --askbob-color-text: var(--modal-text);
        --askbob-color-text-secondary: var(--modal-text-secondary);
        --askbob-color-surface: var(--modal-surface);
        --askbob-color-border: var(--modal-input-border);

        --askbob-modal-preview-radius: 20px;
        --askbob-modal-preview-height: 240px;

        /* Canvas header / scrollbar / scroll button */
        --askbob-canvas-header-bg: var(--bg-color);
        --askbob-scrollbar-color: var(--input-border);
        --askbob-scrollbar-color-hover: var(--muted-color);
        --askbob-scrollbar-width: 4px;
        --askbob-scroll-btn-bg: var(--scroll-btn-bg);
        --askbob-scroll-btn-radius: 50%;
      }

      /* Expand when chat starts */
      .askbob-conversation-active #chatbot-container {
        height: calc(100dvh - var(--header-height)) !important;
        max-width: 852px;
        width: calc(100% - 32px);
        justify-content: flex-start !important;
        margin-top: 0 !important;
        margin-bottom: 0 !important;
      }

      /* Share-link pages open into conversation mode — keep subtitle hidden */
      [data-share-link] .askbob-subtitle {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      .askbob-conversation-active #chatbot-container.ready .askbob-subtitle {
        opacity: 1 !important;
        visibility: visible !important;
        display: none !important;
      }

      .askbob-conversation-active #chatbot-container .askbob-title,
      .askbob-conversation-active #chatbot-container .askbob-subtitle,
      .askbob-conversation-active #askbob-trending-questions,
      .askbob-conversation-active #askbob-primary-input {
        display: none !important;
      }

      /* Canvas fills remaining space and scrolls */
      #askbob-answer-canvas,
      [data-askbob-group="full"] #askbob-answer-canvas {
        flex: 1 1 auto !important;
        width: 100% !important;
        overflow-y: auto !important;
        padding: 20px 0 40px !important;
        display: flex !important;
        flex-direction: column !important;
        min-height: 0 !important;
        scrollbar-gutter: stable;
      }

      /* Input bars anchored to the flex column */
      #askbob-primary-input,
      #askbob-follow-up-input {
        flex: 0 0 auto !important;
        width: 100% !important;
        padding: 0 0 24px !important;
        background: transparent !important;
        border-top: none !important;
        z-index: 10 !important;
        position: relative !important;
      }

      .askbob-conversation-active #askbob-answer-canvas > div {
        padding-bottom: 24px !important;
      }

      /* Thinking dots */
      .conversation-v3-thinking span {
        color: var(--askbob-thinking-text-color, #9ca3af) !important;
      }

      .conversation-v3-thinking .conversation-v3-thinking-dot {
        background-color: var(--askbob-thinking-dot-color, #9ca3af) !important;
      }

      /* Prose overrides */
      #askbob-answer-canvas .prose,
      #askbob-answer-canvas .x-markdown {
        --tw-prose-body: var(--askbob-color-text) !important;
        --tw-prose-bold: var(--theme-prose-bold) !important;
        --tw-prose-links: var(--theme-prose-links) !important;
        --tw-prose-bullets: var(--text-secondary) !important;
        --tw-prose-counters: var(--text-secondary) !important;
      }

      #askbob-answer-canvas [data-bubble-type="user"] .prose,
      #askbob-answer-canvas [data-bubble-type="user"] .x-markdown {
        --tw-prose-body: var(--askbob-bubble-user-color, #ffffff) !important;
        --tw-prose-bold: var(--askbob-bubble-user-color, #ffffff) !important;
      }

      #askbob-answer-canvas a,
      #askbob-answer-canvas .prose a,
      #askbob-answer-canvas .x-markdown a {
        color: var(--theme-prose-links) !important;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .prose
        :where(strong):not(
          :where([class~="not-prose"], [class~="not-prose"] *)
        ) {
        color: unset !important;
      }

      #askbob-answer-canvas strong,
      #askbob-answer-canvas .prose strong,
      #askbob-answer-canvas .x-markdown strong {
        color: var(--theme-prose-bold, inherit) !important;
      }

      /* Trending pills */
      #askbob-trending-questions button:hover,
      [id^="askbob-trending-"] button:hover {
        background: rgba(255, 255, 255, 0.08) !important;
        box-shadow: none !important;
      }

      #askbob-trending-questions > div > h3,
      [id^="askbob-trending-"] h3 {
        font-size: 12px !important;
        color: var(--text-secondary) !important;
        margin-bottom: 12px !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
      }

      /* Input host drop-shadow follows pill shape */
      #askbob-primary-input,
      #askbob-follow-up-input {
        transition: filter 0.2s ease;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.07))
          drop-shadow(0 1px 2px rgba(0, 0, 0, 0.04));
      }

      #askbob-primary-input:hover,
      #askbob-follow-up-input:hover {
        filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.11))
          drop-shadow(0 1px 4px rgba(0, 0, 0, 0.06));
      }

      #askbob-primary-input:focus-within,
      #askbob-follow-up-input:focus-within {
        filter: drop-shadow(
            0 0 10px color-mix(in srgb, var(--primary-color) 40%, transparent)
          )
          drop-shadow(0 4px 16px rgba(0, 0, 0, 0.08));
      }

      .askbob-title {
        font-size: 30px;
        font-weight: 700;
        color: var(--text-color);
        text-align: center;
        margin: 0;
        line-height: 1.2;
      }

      .askbob-subtitle {
        font-size: 15px;
        font-weight: 400;
        color: var(--text-secondary);
        text-align: center;
        margin-top: 4px;
        margin-bottom: 24px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.5;
      }

      @media (max-width: 768px) {
        .site-header {
          padding: 0 16px;
        }
        .brand-logo {
          height: 44px;
        }
        .askbob-logo {
          height: 26px;
        }
        #chatbot-container {
          width: calc(100% - 24px);
        }
        .askbob-conversation-active #chatbot-container {
          width: 100%;
        }
        .askbob-title {
          font-size: 24px;
        }
        .askbob-subtitle {
          font-size: 13px;
        }
        #askbob-follow-up-input {
          margin-inline: 16px !important;
          width: calc(100% - 32px) !important;
        }
      }
    </style>
  </head>

    <!-- Portal bridge: mirror SDK tokens onto any nodes the SDK appends to <body> (modals, popovers) -->
    <script>
      (function () {
        const ASKBOB_VARS = [
          "--askbob-color-primary",
          "--askbob-font-family",
          "--askbob-color-input-text",
          "--askbob-color-input-placeholder",
          "--askbob-input-bg",
          "--askbob-radius-input",
          "--askbob-modal-bg",
          "--askbob-modal-input-bg",
          "--askbob-modal-input-border",
          "--askbob-modal-btn-bg",
          "--askbob-modal-btn-color",
          "--askbob-modal-divider-text-color",
          "--askbob-color-disabled-bg",
          "--askbob-color-text",
          "--askbob-color-text-secondary",
          "--askbob-color-surface",
          "--askbob-color-border",
          "--askbob-submit-btn-bg",
          "--askbob-bubble-user-bg",
          "--askbob-bubble-user-color",
          "--askbob-bubble-assistant-bg",
          "--askbob-bubble-assistant-color",
          "--askbob-modal-preview-radius",
          "--askbob-modal-preview-height",
        ];

        const SKIP_IDS = new Set(["chatbot-container", "theme-switcher"]);

        function syncVars(target) {
          const container = document.getElementById("chatbot-container");
          if (!container) return;
          const computed = getComputedStyle(container);
          ASKBOB_VARS.forEach((v) => {
            const val = computed.getPropertyValue(v).trim();
            if (val) target.style.setProperty(v, val);
          });
        }

        window.syncAllPortals = function () {
          document.body.childNodes.forEach((node) => {
            if (node.nodeType === 1 && !SKIP_IDS.has(node.id)) {
              syncVars(node);
            }
          });
        };

        const observer = new MutationObserver((mutations) => {
          mutations.forEach((m) => {
            m.addedNodes.forEach((node) => {
              if (node.nodeType === 1 && !SKIP_IDS.has(node.id)) {
                syncVars(node);
              }
            });
          });
        });

        observer.observe(document.body, { childList: true });
      })();
    </script>

    <!-- Container hint + share-link marker (runs before the SDK loads) -->
    <script>
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const container = urlParams.get("container") || "auto";
        window.__ASKBOB_CONTAINER__ = container;

        const abaicFromQuery = urlParams.get("abaic");
        const abaicPathMatch = window.location.pathname.match(
          /\/abaic\/([^/]+)/
        );
        const abaicShortcode =
          abaicFromQuery || (abaicPathMatch && abaicPathMatch[1]) || "";
        if (abaicShortcode) {
          document.documentElement.setAttribute("data-share-link", "");
        }
      })();
    </script>

    <!-- Reveal the chatbot on askbob:ready; auto-scroll the canvas as content streams -->
    <script>
      (function () {
        const containerEl = document.getElementById("chatbot-container");
        const loaderEl = document.getElementById("chatbot-loader");
        const showChatbot = () => {
          if (containerEl && !containerEl.classList.contains("ready")) {
            containerEl.classList.add("ready");
            loaderEl?.classList.add("hidden");
          }
        };
        document.addEventListener("askbob:ready", showChatbot);
        setTimeout(showChatbot, 2500);

        const scrollToBottom = () => {
          const canvas = document.getElementById("askbob-answer-canvas");
          if (canvas) {
            canvas.scrollTo({
              top: canvas.scrollHeight,
              behavior: "smooth",
            });
          }
        };

        const canvasEl = document.getElementById("askbob-answer-canvas");
        if (canvasEl) {
          const observer = new MutationObserver(scrollToBottom);
          observer.observe(canvasEl, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        }
      })();
    </script>

    <!-- Input radius observer: pill when single-line, rounded-corner when multi-line -->
    <script>
      (function () {
        const RADIUS_PILL = "200px";
        const RADIUS_MULTI = "28px";
        const SINGLE_LINE_HEIGHT = 60;

        function updateRadius(host) {
          const container = document.getElementById("chatbot-container");
          if (!container) return;
          container.style.setProperty(
            "--askbob-radius-input",
            host.offsetHeight > SINGLE_LINE_HEIGHT ? RADIUS_MULTI : RADIUS_PILL
          );
        }

        function observeInputs() {
          ["askbob-primary-input", "askbob-follow-up-input"].forEach((id) => {
            const host = document.getElementById(id);
            if (!host || host.__roWired) return;
            host.__roWired = true;
            const ro = new ResizeObserver(() => updateRadius(host));
            ro.observe(host);
          });
        }

        document.addEventListener("askbob:ready", observeInputs);
        setTimeout(observeInputs, 3000);
      })();
    </script>

    <!-- Share-link fallback: if an invalid ?abaic= loads, clear the marker so the page returns to idle -->
    <script>
      (function () {
        if (!document.documentElement.hasAttribute("data-share-link")) return;

        var interval = setInterval(function () {
          var instances =
            window.AskBobSDK && window.AskBobSDK.getInstances();
          if (!instances || !instances.length) return;
          clearInterval(interval);

          var instance = instances[0];
          instance.on("share:not_found", function () {
            document.documentElement.removeAttribute("data-share-link");
          });
        }, 100);
      })();
