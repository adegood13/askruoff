<!doctype html>
<html lang="en">
  <head>
    <!-- build: merged-design-v4 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask Ruoff</title>
    <meta
      name="description"
      content="Ask Ruoff — instant, grounded answers on mortgage guidelines, overlays, and policy."
    />
    <link rel="icon" href="https://www.ruoff.com/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ruoff-navy: #132e42;
        --ruoff-navy-80: #1c4057;
        --ruoff-teal: #1f8a9d;
        --surface: #ffffff;
        --surface-muted: #f7f8fa;
        --border: #e6e8ec;
        --text: #11202d;
        --text-muted: #5a6773;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 20px;
        --shadow-sm: 0 1px 2px rgba(19, 46, 66, 0.06);
        --header-height: 80px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: #091c2d;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        height: var(--header-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--ruoff-navy);
      }

      .brand-logo {
        height: 40px;
        width: auto;
        display: block;
      }

      .header-actions {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .askbob-link {
        display: inline-flex;
        align-items: center;
        border-radius: var(--radius-sm);
        text-decoration: none;
      }

      .askbob-link:focus-visible {
        outline: 2px solid var(--ruoff-teal);
        outline-offset: 2px;
      }

      .askbob-logo {
        height: 32px;
        width: auto;
        display: block;
        border-radius: var(--radius-sm);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 14px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font: inherit;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        transition: background 120ms ease, border-color 120ms ease,
          color 120ms ease;
      }

      .btn-primary {
        color: #fff;
        background: var(--ruoff-navy);
        border-color: var(--ruoff-navy);
      }

      .btn-primary:hover {
        background: var(--ruoff-navy-80);
        border-color: var(--ruoff-navy-80);
      }

      .main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .container {
        width: 100%;
        max-width: 820px;
        padding: 40px 24px 48px;
        margin: 0 auto;
      }

      #content-slot {
        min-height: calc(
          100vh - var(--header-height) - var(--footer-height, 56px) - 88px
        );
      }

      .site-footer {
        --footer-height: 56px;
        height: var(--footer-height);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .site-header {
          padding: 0 16px;
        }
        .container {
          padding: 24px 16px 32px;
        }
        .brand-logo {
          height: 32px;
        }
        .askbob-logo {
          height: 26px;
        }
      }

      /* Debug banner — confirms the deployed build and surfaces SDK state. */
      .debug-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2147483647;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 16px;
        background: #ff9800;
        color: #1a1a1a;
        font-size: 13px;
        line-height: 1.4;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        font-family: "Inter", system-ui, sans-serif;
      }
      .debug-banner[data-state="ok"] {
        background: #2e7d32;
        color: #fff;
      }
      .debug-banner[data-state="error"] {
        background: #c62828;
        color: #fff;
      }
      .debug-banner[hidden] {
        display: none;
      }
      .debug-banner strong {
        display: block;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .debug-banner .debug-close {
        margin-left: auto;
        background: transparent;
        border: 0;
        color: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="site-header" role="banner">
        <a
          class="brand"
          href="https://www.ruoff.com/"
          aria-label="Ruoff Mortgage"
        >
          <img
            class="brand-logo"
            src="assets/ruoff-logo.png"
            alt="Ruoff Mortgage"
            style="height: 70px"
          />
        </a>

        <div class="header-actions">
          <a
            class="askbob-link"
            href="https://www.askbobai.com"
            aria-label="AskBobAI"
          >
            <img
              class="askbob-logo"
              src="assets/askbobai-logo.png"
              alt="AskBobAI"
            />
          </a>
          <button class="btn btn-primary" type="button" id="reset-btn">
            Reset
          </button>
        </div>
      </header>

      <main class="main" role="main">
        <div class="container">
          <div id="content-slot" aria-live="polite">
            <!-- AskBob SDK mounts into these slots by ID. -->
            <div id="my-askbob-widget">
              <h2 class="askbob-title" style="display: none">
                Ask me anything about agency guidelines...
              </h2>
              <div id="askbob-primary-input"></div>
              <div id="askbob-trending-questions"></div>
              <div id="askbob-answer-canvas"></div>
              <div id="askbob-follow-up-input"></div>
            </div>
          </div>
        </div>
      </main>

      <footer class="site-footer" role="contentinfo">
        <span
          >&copy; <span id="year"></span> Ruoff Mortgage. All rights
          reserved.</span
        >
      </footer>
    </div>

    <div
      id="debug-banner"
      class="debug-banner"
      data-state="info"
      role="status"
      aria-live="polite"
    >
      <div>
        <strong id="debug-title">Loading AskBob engine…</strong>
        <span id="debug-detail">Waiting for engine.js to load.</span>
      </div>
      <button
        type="button"
        class="debug-close"
        aria-label="Dismiss debug banner"
        onclick="document.getElementById('debug-banner').hidden = true"
      >
        ×
      </button>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      document.getElementById("reset-btn").addEventListener("click", () => {
        window.location.reload();
      });
    </script>

    <!-- AskBob embed — do not modify the script tag. -->
    <script
      src="https://ruoff-mortgage.askbobai.com/engine.js"
      data-chatbot-uid="e0ba5b3a-082b-47a0-b0f1-ec99b1038948"
      data-tenant-uid="d52e359e-2d7e-4579-bd2e-87e60dfc2f77"
      data-client-uid="d9dc6f59-def7-4127-b231-e9d94ce630b5"
      data-url="https://ruoff-mortgage.askbobai.com"
      data-mode="embedded"
      async
    ></script>

    <script>
      (function () {
        var banner = document.getElementById("debug-banner");
        var titleEl = document.getElementById("debug-title");
        var detailEl = document.getElementById("debug-detail");
        function setBanner(state, title, detail) {
          banner.dataset.state = state;
          titleEl.textContent = title;
          detailEl.textContent = detail;
        }

        var script = document.querySelector(
          'script[src*="askbobai.com/engine.js"]'
        );
        if (script) {
          script.addEventListener("load", function () {
            setBanner(
              "info",
              "engine.js loaded",
              "typeof window.AskBob = " + typeof window.AskBob
            );
          });
          script.addEventListener("error", function () {
            setBanner(
              "error",
              "engine.js FAILED to load",
              "Check DevTools → Network for engine.js status."
            );
          });
        }

        var start = Date.now();
        var poll = setInterval(function () {
          var slotInput = document.getElementById("askbob-primary-input");
          var slotCanvas = document.getElementById("askbob-answer-canvas");
          var populated =
            (slotInput && slotInput.children.length > 0) ||
            (slotCanvas && slotCanvas.children.length > 0);
          if (populated) {
            setBanner(
              "ok",
              "Widget rendered into slots",
              "primary-input children: " +
                (slotInput ? slotInput.children.length : 0) +
                ", answer-canvas children: " +
                (slotCanvas ? slotCanvas.children.length : 0)
            );
            setTimeout(function () {
              banner.hidden = true;
            }, 4000);
            clearInterval(poll);
            return;
          }
          if (Date.now() - start > 20000) {
            setBanner(
              "error",
              "Slots still empty after 20s",
              "window.AskBob = " +
                typeof window.AskBob +
                ". Tenant may be blocking this origin, or widget is rendering elsewhere."
            );
            clearInterval(poll);
          }
        }, 500);
      })();
    </script>
  </body>
</html>
